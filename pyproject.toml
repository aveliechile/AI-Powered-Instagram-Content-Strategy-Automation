[project]
name = "instagram_team"
version = "0.1.0"
description = "instagram_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.76.9,<1.0.0"
]

[project.scripts]
instagram_team = "instagram_team.main:run"
run_crew = "instagram_team.main:run"
train = "instagram_team.main:train"
replay = "instagram_team.main:replay"
test = "instagram_team.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
